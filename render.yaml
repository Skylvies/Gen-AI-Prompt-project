# Render Blueprint: deploys the FastAPI backend. (The frontend goes on Vercel/Netlify - see docs/DEPLOYMENT.md.)
services:
  - type: web
    name: prompt-lab-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: LLM_PROVIDER
        value: groq # free tier, open-source Llama models
      - key: LLM_API_KEY
        sync: false # you paste your (Groq) key in the Render dashboard; it is never stored in git
      - key: REAL_MODE_ACCESS_CODE
        sync: false # choose a code so strangers cannot use up your free quota
      - key: MAX_WORKERS
        value: 2 # be gentle with free-tier rate limits
      - key: CORS_ORIGINS
        sync: false # set to your frontend URL, e.g. https://your-app.vercel.app
